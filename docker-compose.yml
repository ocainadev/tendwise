services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: tendwise-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tendwise}
      POSTGRES_USER: ${POSTGRES_USER:-tendwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  business-service:
    build: ./business-service
    container_name: tendwise-business-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tendwise}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tendwise}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "8080:8080"

volumes:
  db-data:
