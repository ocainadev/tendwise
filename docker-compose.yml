services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: tendwise-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tendwise}
      POSTGRES_USER: ${POSTGRES_USER:-tendwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  business-service:
    build: ./business-service
    container_name: tendwise-business-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tendwise}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tendwise}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BUSINESS_SERVICE_API_KEY: ${BUSINESS_SERVICE_API_KEY:?Set BUSINESS_SERVICE_API_KEY in .env}
      # Optional: empty values skip creating the platform admin and the demo users.
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      DEMO_USERS_PASSWORD: ${DEMO_USERS_PASSWORD:-}
      # Panel login: the key that signs access tokens (see .env.example for how to make one).
      AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:?Set AUTH_JWT_PRIVATE_KEY in .env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    ports:
      - "8080:8080"

  agent-service:
    build: ./agent-service
    container_name: tendwise-agent-service
    depends_on:
      db:
        condition: service_healthy
    # Empty values are fine: agent-service falls back to its own defaults
    # (app/core/config.py), and it starts without an LLM key.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tendwise}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-tendwise}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BUSINESS_SERVICE_URL: ${BUSINESS_SERVICE_URL:-}
      BUSINESS_SERVICE_API_KEY: ${BUSINESS_SERVICE_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      CONVERSATION_RETENTION_DAYS: ${CONVERSATION_RETENTION_DAYS:-}
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      # The business .md files to ingest (read-only).
      - ./data:/app/data:ro
      # Downloaded embedding model, kept between restarts and rebuilds.
      - embedding-models:/app/.cache/fastembed
    # The slim image has no curl, so the check uses Python's standard library.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    container_name: tendwise-web
    depends_on:
      - agent-service
    ports:
      - "5173:80"

volumes:
  db-data:
  embedding-models:
