name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the previous, now outdated, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each project is checked only once it exists in the repo
  # (business-service from T03, agent-service from T06, web from T14).
  detect:
    name: Detect projects
    runs-on: ubuntu-latest
    outputs:
      business-service: ${{ steps.detect.outputs.business-service }}
      agent-service: ${{ steps.detect.outputs.agent-service }}
      web: ${{ steps.detect.outputs.web }}
      compose: ${{ steps.detect.outputs.compose }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          exists() { [ -f "$1" ] && echo true || echo false; }
          {
            echo "business-service=$(exists business-service/pom.xml)"
            echo "agent-service=$(exists agent-service/pyproject.toml)"
            echo "web=$(exists web/package.json)"
            echo "compose=$(exists docker-compose.yml)"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  compose:
    name: docker compose config
    needs: detect
    if: needs.detect.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: POSTGRES_PASSWORD=ci docker compose config --quiet

  business-service:
    name: business-service (lint + tests)
    needs: detect
    if: needs.detect.outputs.business-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # verify runs Spotless check and the tests (Testcontainers uses the runner's Docker).
      - run: ./mvnw -B verify

  agent-service:
    name: agent-service (lint + tests)
    needs: detect
    if: needs.detect.outputs.agent-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-service
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: agent-service/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  web:
    name: web (lint + tests)
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # Single check to require in branch protection: passes only if no job failed.
  # Skipped jobs (projects that do not exist yet) count as OK.
  ci-ok:
    name: CI OK
    if: always()
    needs: [detect, compose, business-service, agent-service, web]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed."
