[project]
name = "agent-service"
version = "0.1.0"
description = "Tendwise agent-service: the AI clerk (FastAPI, LLM adapters, later RAG and LangGraph)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.162.5",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.21",
    "langgraph-checkpoint-postgres>=3.2.0",
    "openai>=3.50.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the `app` package without installing it.
pythonpath = ["."]
# Slow tests (e.g. the real embedding model, a ~220 MB download) are skipped by
# default. Run them with: uv run pytest -m slow
addopts = "-m 'not slow'"
markers = ["slow: needs the real embedding model; run with -m slow"]
