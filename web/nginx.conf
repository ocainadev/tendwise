server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The chat calls a relative /api URL; forward it to agent-service inside
    # the compose network, so the browser sees one origin and needs no CORS.
    location /api/ {
        proxy_pass http://agent-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A reply can take several seconds (LLM + tools).
        proxy_read_timeout 60s;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
