server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The browser sees one origin for the app and every API, so the session
    # cookies just work and no CORS is needed. nginx picks the longest
    # matching prefix, so the business-service locations below win over /api/.

    # Live event streams (SSE, T40): the widget's stream of one conversation and
    # the panel's stream of one business. Regex locations win over the prefix
    # locations below. nginx must pass each event on at once (no buffering) and
    # keep the idle stream open (business-service sends a heartbeat every 25 s).
    location ~ ^/(public/v1/conversations|api/v1/panel)/[^/]+/events$ {
        proxy_pass http://business-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Panel login, business panel and platform admin APIs: business-service.
    location /auth/ {
        proxy_pass http://business-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Knowledge base routes of the panel (T50): agent-service. A regex
    # location wins over the /api/v1/panel/ prefix below.
    location ~ ^/api/v1/panel/[^/]+/documents(/|$) {
        proxy_pass http://agent-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Knowledge page test chat (T51): agent-service too.
    location ~ ^/api/v1/panel/[^/]+/playground$ {
        proxy_pass http://agent-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/panel/ {
        proxy_pass http://business-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/admin/ {
        proxy_pass http://business-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else under /api (the demo chat's POST /api/v1/chat) still
    # goes to agent-service until T42.
    location /api/ {
        proxy_pass http://agent-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A reply can take several seconds (LLM + tools).
        proxy_read_timeout 60s;
    }

    # Single-page app: unknown paths (/demo, /login, /app/..., /admin/...)
    # fall back to index.html and React Router shows the page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
