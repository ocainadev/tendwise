# Compose override for the end-to-end tests (web/e2e): the normal stack, with
# agent-service answering through a fake LLM instead of a real provider.
# From the repository root:
#   docker compose -f docker-compose.yml -f web/e2e/docker-compose.e2e.yml up -d --build
# Paths are relative to the repository root (the first file's folder).

services:
  fake-llm:
    image: node:24-alpine
    container_name: tendwise-fake-llm
    command: ["node", "/fake-llm/server.mjs"]
    volumes:
      - ./web/e2e/fake-llm:/fake-llm:ro

  agent-service:
    depends_on:
      - fake-llm
    environment:
      LLM_PROVIDER: openai
      LLM_MODEL: fake-llm
      # Any value: the fake does not check it, but the SDK needs one.
      OPENAI_API_KEY: e2e-fake-key
      # Read by the openai SDK itself, so agent-service needs no change.
      OPENAI_BASE_URL: http://fake-llm:4010/v1
