spring:
  application:
    name: business-service
  autoconfigure:
    # Users log in through /auth/login (AuthService), so Spring Boot's default in-memory user
    # (and its "generated security password" log line) is not wanted.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  # Local defaults. In docker compose they are overridden by
  # SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
  datasource:
    url: jdbc:postgresql://localhost:5432/tendwise
    username: tendwise
    password: ${POSTGRES_PASSWORD:}
    hikari:
      data-source-properties:
        # Keep PostgreSQL's error "Detail" (e.g. "Key (email)=(ana@example.com) already exists")
        # out of exceptions and logs, so a constraint error never logs personal data.
        logServerErrorDetail: false
  flyway:
    # Flyway creates the core schema and keeps its history table there.
    schemas: core
    default-schema: core
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core
  mvc:
    # Framework errors (400 on a bad parameter, 405...) are returned as RFC 7807 Problem Details.
    problemdetails:
      enabled: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui

tendwise:
  # Shared key that callers (agent-service) send in the X-Api-Key header.
  # Required: the service does not start without it.
  api-key: ${BUSINESS_SERVICE_API_KEY:}
  # First users, created on startup by UserBootstrap (T30). Empty values skip that step.
  bootstrap:
    platform-admin-email: ${PLATFORM_ADMIN_EMAIL:}
    platform-admin-password: ${PLATFORM_ADMIN_PASSWORD:}
    # When set, creates owner@<slug>.test and agent@<slug>.test for each demo business.
    demo-users-password: ${DEMO_USERS_PASSWORD:}
  # Panel login (T31, ADR 0003).
  auth:
    # Base64 Ed25519 private key (PKCS#8) that signs the access tokens. Required: the service does
    # not start without it. Generate one with the command in the README; never commit it.
    jwt-private-key: ${AUTH_JWT_PRIVATE_KEY:}
    # Secure flag on the session cookies. Turn it off only for plain http that is not localhost.
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
