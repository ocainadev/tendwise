spring:
  application:
    name: business-service
  autoconfigure:
    # Users log in through /auth/login (AuthService), so Spring Boot's default in-memory user
    # (and its "generated security password" log line) is not wanted.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  # Local defaults. In docker compose they are overridden by
  # SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
  datasource:
    url: jdbc:postgresql://localhost:5432/tendwise
    username: tendwise
    password: ${POSTGRES_PASSWORD:}
    hikari:
      data-source-properties:
        # Keep PostgreSQL's error "Detail" (e.g. "Key (email)=(ana@example.com) already exists")
        # out of exceptions and logs, so a constraint error never logs personal data.
        logServerErrorDetail: false
  flyway:
    # Flyway creates the core schema and keeps its history table there.
    schemas: core
    default-schema: core
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core
  threads:
    virtual:
      # Java 21 virtual threads for requests and @Scheduled tasks: each open SSE stream (T40) waits
      # cheaply instead of holding a platform thread.
      enabled: true
  mvc:
    # Framework errors (400 on a bad parameter, 405...) are returned as RFC 7807 Problem Details.
    problemdetails:
      enabled: true

server:
  port: 8080
  # Behind nginx, take the client IP from X-Forwarded-For (needed by the per-IP rate limit).
  # Tomcat only trusts that header from private-network proxies, so a client cannot fake it.
  forward-headers-strategy: native

springdoc:
  swagger-ui:
    path: /swagger-ui

tendwise:
  # Shared key that callers (agent-service) send in the X-Api-Key header.
  # Required: the service does not start without it.
  api-key: ${BUSINESS_SERVICE_API_KEY:}
  # First users, created on startup by UserBootstrap (T30). Empty values skip that step.
  bootstrap:
    platform-admin-email: ${PLATFORM_ADMIN_EMAIL:}
    platform-admin-password: ${PLATFORM_ADMIN_PASSWORD:}
    # When set, creates owner@<slug>.test and agent@<slug>.test for each demo business.
    demo-users-password: ${DEMO_USERS_PASSWORD:}
  # Panel login (T31, ADR 0003).
  auth:
    # Base64 Ed25519 private key (PKCS#8) that signs the access tokens. Required: the service does
    # not start without it. Generate one with the command in the README; never commit it.
    jwt-private-key: ${AUTH_JWT_PRIVATE_KEY:}
    # Secure flag on the session cookies. Turn it off only for plain http that is not localhost.
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  # Public conversation API for the website chat widget (T38).
  public-api:
    # Customer messages per conversation in any window, counted in core.messages (all instances).
    conversation-limit: 20
    conversation-window: 10m
    # Conversation starts and messages per IP in any window, in memory per instance.
    ip-limit: 30
    ip-window: 1m
  # agent-service's internal API (T39). The X-Api-Key it gets is tendwise.api-key above.
  agent-service:
    url: ${AGENT_SERVICE_URL:http://localhost:8000}
    # One agent turn; past this the attempt fails and the job is retried.
    timeout: 60s
  # The core.jobs worker (T39, docs/architecture.md "Jobs").
  jobs:
    # false = this instance runs no jobs (other instances, or the tests, do).
    worker-enabled: ${JOB_WORKER_ENABLED:true}
    poll-interval: 1s
    # Attempts in total; after the last one the job is FAILED (an AI_REPLY moves to WAITING).
    max-attempts: 3
    # Wait before the 2nd attempt; it doubles for each later one (5s, 10s...).
    retry-delay: 5s
    # A job RUNNING for longer than this is taken to be lost (instance died) and runs again.
    # Keep it well above agent-service.timeout.
    stale-after: 5m
    # Jobs running at the same time on one instance.
    max-concurrent: 4
  # Live events: LISTEN/NOTIFY and the SSE streams (T40, docs/architecture.md "Real-time").
  realtime:
    # A ": heartbeat" comment on every open stream, so proxies keep idle streams open.
    heartbeat-interval: 25s
    # A stream ends after this; the browser reconnects with Last-Event-ID.
    stream-timeout: 30m
    # Wait before the LISTEN connection tries again after it broke.
    reconnect-delay: 2s
